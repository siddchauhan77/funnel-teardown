name: Proof release checks
on:
  push:
    branches: [main]
    paths: ['**.py', '**.html', '**.js', '**.css', 'requirements*.txt', '.github/workflows/proof-release.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proof-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source revision
        run: git archive --format=zip -o /tmp/teardown-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: /tmp/teardown-source.zip
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run complete test suite (no provider keys)
        run: |
          mkdir -p proof-results
          python -m pytest -q --junitxml=proof-results/pytest.xml
      - name: Compile source
        if: always()
        run: python -m compileall -q agents utils web teardown.py
      - name: Record revision
        if: always()
        run: |
          mkdir -p proof-results
          git rev-parse HEAD > proof-results/commit.txt
          python --version > proof-results/python.txt
          python -m pip freeze > proof-results/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-results-${{ github.sha }}
          path: proof-results/
          retention-days: 30
